<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Test — Vẽ Hình Không Gian</title>
<style>
:root{--bg:#0f1420;--panel:#171e2e;--line:#2a3450;--text:#e6ebf5;--muted:#8d98b3;--ok:#7ee0a1;--bad:#ff6b8b;--wait:#ffb454}
body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:13.5px/1.55 system-ui,"Segoe UI",sans-serif}
h1{font-size:18px;margin:0 0 4px}
h2{font-size:15px;margin:26px 0 2px;color:var(--text)}
.lead{color:var(--muted);margin-bottom:16px;font-size:13px}
.sum{padding:10px 14px;border-radius:8px;font-size:16px;font-weight:600;margin-bottom:14px;border:1px solid var(--line);background:var(--panel)}
.sum.ok{color:var(--ok)} .sum.bad{color:var(--bad)}
.case{border-top:1px solid var(--line);padding:7px 0}
.hd{display:flex;gap:10px;align-items:baseline}
.hd b{min-width:110px;font-size:12px;letter-spacing:.04em}
.n{color:var(--muted);min-width:34px}
.t{color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ok{color:var(--ok)} .bad{color:var(--bad)} .wait{color:var(--wait)}
.diff{color:var(--bad);margin:3px 0 0 124px;font:12.5px/1.5 ui-monospace,Consolas,monospace;white-space:pre-wrap}
.bang{border-collapse:collapse;margin-top:8px;font-size:13px}
.bang th,.bang td{border:1px solid var(--line);padding:6px 12px;text-align:left}
.bang th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em}
.bang td:first-child{color:var(--text)}
.bang td{color:var(--ok)}
.note{color:var(--muted);margin:3px 0 0 124px;font-size:12.5px}
</style>
</head>
<body>
<h1>Test — Vẽ Hình Không Gian</h1>
<div class="lead">Phần A canh không hồi quy so với bản tham chiếu đã đóng băng. Phần B kiểm tra hành vi trung thực về dữ kiện.</div>
<div id="out">Đang chạy…</div>
<script type="importmap">{"imports":{"three":"../vendor/three.module.js"}}</script>
<script type="module" src="./runner.js"></script>
</body>
</html>
